// android/settings.gradle

pluginManagement {
    // Lee flutter.sdk de local.properties
    def props = new Properties()
    file("local.properties").withInputStream { props.load(it) }
    def flutterSdkPath = props.getProperty("flutter.sdk")
    assert flutterSdkPath != null : "flutter.sdk not set in local.properties"

    // Incluye las tools de Flutter
    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    // Repos para plugins
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

// Versiones de plugins
plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application"           version "8.5.2" apply false
    id "com.android.library"               version "8.5.2" apply false
    id "org.jetbrains.kotlin.android"      version "1.9.24" apply false
    id "com.google.gms.google-services"    version "4.4.2" apply false
}

rootProject.name = "elitestyle_app"
include(":app")
